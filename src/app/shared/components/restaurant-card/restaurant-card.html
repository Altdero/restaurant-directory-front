<article class="restaurant-card">
  <div class="cover-wrap">
    <a class="card-link" [routerLink]="['/restaurants', restaurant().id]" tabindex="-1">
      @if (restaurant().coverImage) {
        <img class="cover" [ngSrc]="restaurant().coverImage" width="400" height="240" alt="" />
      } @else {
        <div class="cover placeholder" aria-hidden="true"></div>
      }
      <div class="cover-overlay" aria-hidden="true"></div>
      <div class="rating-badge" aria-hidden="true">
        ★ {{ restaurant().averageRating | number: '1.1-1' }}
      </div>
    </a>
    <app-favorite-button
      class="heart-overlay"
      [isFavorited]="isFavorited()"
      [isAuthenticated]="isAuthenticated()"
      [loginReturnUrl]="loginReturnUrl()"
      (toggled)="toggleFavorite.emit()"
    />
  </div>

  <a class="card-link" [routerLink]="['/restaurants', restaurant().id]">
    <div class="body">
      <h3>{{ restaurant().name }}</h3>
      <p class="location">{{ restaurant().city }}</p>

      <app-category-chips [categories]="restaurant().categories" />

      <div class="meta">
        <span class="rating">
          <app-rating-stars [rating]="restaurant().averageRating" />
          <span class="review-count" i18n="@@restaurantCard.reviewCount">
            ({{ restaurant().totalReviews }})
          </span>
        </span>
        <app-price-range-badge class="price" [priceRange]="restaurant().priceRange" />
      </div>
    </div>
  </a>
</article>
