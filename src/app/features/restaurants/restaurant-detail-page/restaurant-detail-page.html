<div class="restaurant-detail-page">
  @if (restaurant.error(); as apiError) {
    <app-error-state [message]="apiErrorMessage(apiError)" (retry)="restaurant.reload()" />
  } @else if (restaurant.isLoading()) {
    <p i18n="@@restaurantDetailPage.loading">Loading restaurant…</p>
  } @else if (restaurant.value(); as loadedRestaurant) {
    <app-restaurant-hero [restaurant]="loadedRestaurant" />

    <app-menu-section
      [menuItems]="menuItems.value()?.results ?? []"
      [isLoading]="menuItems.isLoading()"
      [error]="menuItems.error()"
    />

    <app-reviews-section
      [reviews]="reviews()"
      [isLoading]="reviewsIsLoading()"
      [error]="reviewsError()"
      [hasMore]="hasMoreReviews()"
      [isLoadingMore]="isLoadingMoreReviews()"
      [isAuthenticated]="isAuthenticated()"
      [myReview]="myReview()"
      [loginReturnUrl]="loginReturnUrl()"
      [isFormOpen]="isReviewFormOpen()"
      [formPending]="reviewFormPending()"
      [formError]="reviewFormError()"
      (loadMore)="loadMoreReviews()"
      (openForm)="isReviewFormOpen.set(true)"
      (cancelForm)="isReviewFormOpen.set(false)"
      (submitForm)="submitReview($event)"
      (deleteReview)="confirmDeleteReview()"
    />
  }
</div>
