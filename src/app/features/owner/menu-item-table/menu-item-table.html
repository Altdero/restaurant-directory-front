@if (items().length === 0) {
  <app-empty-state [message]="emptyMessage" />
} @else {
  @for (group of groups(); track group.category) {
    <h3>{{ categoryLabel(group.category) }}</h3>
    @for (item of group.items; track item.id) {
      <article class="row" [class.unavailable]="!item.isAvailable">
        <span class="name">{{ item.name }}</span>
        <span class="price">${{ item.price.toFixed(2) }}</span>
        <button mat-button type="button" (click)="edit.emit(item)" i18n="@@menuItemTable.edit">
          Edit
        </button>
        <button mat-button type="button" (click)="delete.emit(item)" i18n="@@menuItemTable.delete">
          Delete
        </button>
      </article>
    }
  }
}
