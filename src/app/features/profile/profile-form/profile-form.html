<form [formGroup]="form" (ngSubmit)="submit()">
  <app-image-uploader
    [imageUrl]="avatarUrl()"
    [isUploading]="isUploadingImage()"
    (fileSelected)="imageSelected.emit($event)"
  />

  @if (user(); as user) {
    <p class="read-only">
      <span i18n="@@profileForm.username">Username</span>: {{ user.username }}
    </p>
    <p class="read-only"><span i18n="@@profileForm.role">Role</span>: {{ user.role }}</p>
  }

  <mat-form-field appearance="outline">
    <mat-label i18n="@@profileForm.email">Email</mat-label>
    <input matInput type="email" formControlName="email" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n="@@profileForm.firstName">First name</mat-label>
    <input matInput formControlName="first_name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n="@@profileForm.lastName">Last name</mat-label>
    <input matInput formControlName="last_name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n="@@profileForm.phone">Phone</mat-label>
    <input matInput formControlName="phone" />
  </mat-form-field>

  @if (error(); as apiError) {
    <p class="error" role="alert">{{ apiErrorMessage(apiError) }}</p>
  }

  <div class="actions">
    <button
      mat-flat-button
      type="submit"
      [disabled]="form.invalid || isPending() || isUploadingImage()"
    >
      @if (isPending()) {
        <mat-progress-spinner diameter="20" mode="indeterminate" />
      } @else {
        <span i18n="@@profileForm.submit">Save changes</span>
      }
    </button>
  </div>
</form>
