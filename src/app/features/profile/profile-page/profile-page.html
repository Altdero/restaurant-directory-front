<div class="profile-page">
  <h1 i18n="@@profilePage.title">Profile</h1>
  <p class="subtitle" i18n="@@profilePage.subtitle">Manage your account details.</p>

  @if (user(); as user) {
    <app-profile-form
      [user]="user"
      [isPending]="isPending()"
      [error]="formError()"
      [avatarUrl]="avatarUrl()"
      [isUploadingImage]="isUploadingImage()"
      (save)="submit($event)"
      (imageSelected)="onImageSelected($event)"
    />
  }
</div>
